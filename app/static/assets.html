<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材检索 · 海报工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/suite.css"></head><body>
<header><strong>在线素材检索</strong><nav><a href="/">编辑器</a><a href="/tasks.html">批量任务</a><a href="/models.html">模型中心</a></nav></header><main class="wide">
<section class="card panel"><h1>输入名称，直接挑选海报</h1><p>输入影视名称后同时查询 TVmaze 与已配置的 TMDB，汇总海报候选。选择一张后会下载到本机、自动识别横竖方向、创建任务并打开编辑器。</p><div class="controls"><label>影视名称<input id="query" placeholder="例如：繁花 / The Last of Us" autocomplete="off"></label><label>输出规格<select id="profile"><option value="auto">自动匹配横版 / 竖版（推荐）</option></select></label><button id="search" class="primary">查询海报</button></div><p id="sourceStatus" class="subtle"></p><div id="results" class="asset-list"></div></section>
<details id="configuration" class="card panel" hidden><summary>管理员 · 网络与来源配置</summary><p id="configured"></p><label><input id="network" type="checkbox">启用在线素材检索</label><label>TMDB Read Access Token<input id="tmdb" type="password" autocomplete="off" placeholder="留空保留原值"></label><label>Fanart API Key<input id="fanart" type="password" autocomplete="off" placeholder="留空保留原值"></label><p class="subtle">凭据仅保存在本机 data 中，不回传浏览器。该目录及备份应按敏感数据保管。</p><button id="save">保存</button></details>
</main><div id="toast" role="status" hidden></div><script src="/common.js"></script><script src="/assets.js"></script></body></html>
