<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标题工作室</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/suite.css"><link rel="stylesheet" href="/titles.css"></head><body>
<header><strong>透明标题工作室</strong><nav><a href="/">海报编辑器</a> · <a href="/assets.html">查询艺术字 / 官网入口</a></nav></header>
<main class="wide"><section class="card panel"><h1>独立编辑、保存与复用标题</h1><p>不需要联网，也不需要先完成背景修补。保存会建立新版本，保留旧版；透明 PNG 可以拷贝到其他电脑。</p>
<div class="controls"><label>导入本地标题<input type="file" id="titleFile" accept="image/png,image/webp,image/jpeg"></label><label>名称<input id="titleName" maxlength="120" value="未命名标题"></label><label>工具<select id="titleTool"><option value="erase">擦除杂质</option><option value="restore">恢复原始像素</option><option value="component">点选删除连通色块</option></select></label><label>笔刷<input id="titleBrush" type="range" min="1" max="150" value="12"></label><label>缩放<select id="zoom"><option value="1">100%</option><option value="2">200%</option><option value="4">400%</option></select></label><button id="undo">撤销</button><button id="redo">重做</button></div>
<div class="title-scroll"><canvas id="titleCanvas" width="1" height="1"></canvas></div>
<p class="subtle">擦除仅改变透明度；恢复只能找回导入时已有的像素。色块删除会删除与点击位置连通的部分，请留意相连笔画，可撤销。大图最多保留 12 步且限制历史内存。</p>
<div class="controls"><button id="trim">裁切透明边</button><button id="resetTitle">恢复到导入版本</button><button id="exportTitle">下载透明 PNG</button><button id="saveTitle" class="primary">另存新版本到标题库</button><button id="applyTitle">保存并应用到原海报任务</button></div><p id="titleStatus" role="status"></p></section>
<section class="card panel"><h2>本地标题库</h2><button id="refreshTitles">刷新列表</button><div id="titleLibrary" class="asset-list"></div><button id="moreTitles">加载更多</button></section></main><div id="toast" role="status" hidden></div><script src="/common.js"></script><script src="/titles.js"></script></body></html>
