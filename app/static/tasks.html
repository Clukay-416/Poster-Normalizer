<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务中心 · 海报工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/suite.css"></head><body><header><div class="brand"><span class="mark">P</span><strong>任务中心</strong></div><nav><a href="/">编辑器</a><a href="/models.html">模型中心</a><a href="/assets.html">素材检索</a></nav></header><main>
<section class="topline"><div><span class="eyebrow">BATCH WORKSPACE</span><h1>导入、处理、复核，任务始终留存。</h1><p>自动结果仍须人工确认；暂停 GPU 与暂停整个队列是两个独立操作。</p></div><button id="queueToggle">暂停全部队列</button></section><div id="stats" class="stats"></div>
<section class="two-columns"><div class="card panel"><h2>ZIP / 本机文件夹导入</h2><label>输出规格<select id="profile"></select></label><label>ZIP（最多500张，解压后总计350MB）<input id="zip" type="file" accept=".zip"></label><button id="importZip">导入 ZIP</button><label>浏览器选取文件夹<input id="folder" type="file" webkitdirectory multiple></label><button id="importFolder">导入文件夹（分批提交）</button><p class="subtle">服务器不会更改原素材。文件夹导入会按100张且每批约300MB分组。</p></div><div class="card panel" id="serverPanel"><h2>服务器 / NAS 文件夹</h2><label>授权目录（每行一个，管理员设置）<textarea id="roots" rows="3"></textarea></label><button id="saveRoots">保存授权目录</button><label>本次读取路径<input id="serverPath" placeholder="D:\素材\海报 或 \\NAS\海报"></label><label><input id="recursive" type="checkbox"> 包含子目录</label><button id="importServer">读取并导入</button><p class="subtle">路径是服务器电脑的路径，需服务器自身有读取权限。每次最多500张，不修改源文件。</p></div></section>
<section class="card panel"><div class="toolbar"><input id="query" placeholder="搜索文件名 / 提交人 / 批次"><select id="status"><option value="">全部状态</option><option>MANUAL</option><option>QUEUED</option><option>RUNNING</option><option>PAUSED</option><option>REVIEW</option><option>COMPLETED</option><option>FAILED</option><option>CANCELLED</option><option>INTERRUPTED</option></select><input id="projectFilter" placeholder="项目筛选（完整名称）"><button id="filter">查询</button></div>
<div class="toolbar"><select id="engine"><option value="opencv">OpenCV 修补</option><option value="lama">LaMa 修补（需模型）</option></select><button id="auto" class="primary">自动处理所选</button><button data-action="pause">暂停所选</button><button data-action="resume">恢复所选</button><button data-action="cancel">取消所选</button><button data-action="retry">重试所选</button><button data-action="approve">确认所选结果</button></div>
<div class="toolbar"><input id="project" placeholder="给所选任务归入项目"><select id="priority"><option value="0">普通</option><option value="1">较高</option><option value="2">高</option><option value="3">紧急</option></select><button id="label">应用项目 / 优先级</button><a href="/api/export" target="_blank">导出全部已确认结果</a></div>
<div class="tablewrap"><table><thead><tr><th><input id="selectAll" type="checkbox"></th><th>文件</th><th>状态</th><th>项目</th><th>提交人</th><th>版本</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="row"><button id="previous">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div></section>
<section class="card panel"><h2>备份</h2><p>数据库备份不包含原图和成品。完整迁移任务，请关服后复制整个 data 文件夹；迁移模型只需 models 文件夹。</p><a id="backup" href="/api/backup">下载一致性数据库备份</a></section>
</main><div id="toast" hidden role="status"></div><script src="/common.js"></script><script src="/tasks.js"></script></body></html>
