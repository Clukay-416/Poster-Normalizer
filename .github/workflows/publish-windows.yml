name: Publish Windows offline package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build helper
        run: python -m pip install packaging pytest
      - name: Download locked Windows dependencies
        run: >
          python -m pip download --only-binary=:all: --no-deps --platform win_amd64
          --python-version 313 --implementation cp --abi cp313
          -r offline/requirements-win313.lock -d offline/wheels
      - name: Verify application on Windows
        run: |
          python -m pip install --no-index --find-links offline/wheels -r offline/requirements-win313.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location app
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem static/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Pop-Location
      - name: Browser roundtrip verification
        run: |
          npm install --prefix "$env:RUNNER_TEMP/poster-browser" playwright@1.51.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:RUNNER_TEMP/poster-browser/node_modules/playwright/cli.js" install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = "$env:RUNNER_TEMP/poster-browser/node_modules"
          node app/tests/browser_smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify offline package
        run: |
          python app/scripts/build_offline.py
          python app/scripts/package_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.2 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.3.2 ..\PosterNormalizer_V0.3.2_Windows_Offline.zip --clobber
          } else {
            gh release create v0.3.2 ..\PosterNormalizer_V0.3.2_Windows_Offline.zip --title "Poster Normalizer V0.3.2" --generate-notes
          }
