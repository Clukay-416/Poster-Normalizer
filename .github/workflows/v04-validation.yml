name: V0.4 complete package validation
on:
  push:
    branches: [v0.4-development]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  application:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install packaging pytest
      - run: >-
          python -m pip download --only-binary=:all: --no-deps --platform win_amd64 --python-version 313 --implementation cp --abi cp313 -r offline/requirements-win313.lock -d offline/wheels
      - name: Python and browser verification
        shell: pwsh
        run: |
          python -m pip install --no-index --find-links offline/wheels -r offline/requirements-win313.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location app
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem static/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Pop-Location
          npm install --prefix "$env:RUNNER_TEMP/poster-browser" playwright@1.51.1
          node "$env:RUNNER_TEMP/poster-browser/node_modules/playwright/cli.js" install chromium
          $env:NODE_PATH = "$env:RUNNER_TEMP/poster-browser/node_modules"
          node app/tests/browser_smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python app/scripts/prepare_ai_sources.py
      - name: Build complete application candidate
        run: |
          python app/scripts/build_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python app/scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-application-candidate
          path: dist/PosterNormalizer_V0.4.0-rc1_Windows_Offline.*
          retention-days: 7
  full-release:
    needs: application
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    concurrency:
      group: v04-rc1-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-application-candidate
          path: dist
      - name: Download validated Windows AI environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for profile in modern powerpaint anytext; do
            gh run download 35213880737 --name "offline-ai-$profile" --dir "offline-ai/$profile"
          done
      - name: Assemble full package with verified runtime parts
        run: python app/scripts/package_full.py
      - name: Publish complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0-rc1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace a published package.'
            exit 1
          fi
          gh release create v0.4.0-rc1 --target "$GITHUB_SHA" --draft --prerelease --title 'Poster Normalizer V0.4.0 RC1 · 完整离线依赖包' --notes-file docs/RELEASE_V0.4.0-rc1.md
          gh release upload v0.4.0-rc1 dist-full/*
          gh release edit v0.4.0-rc1 --draft=false
  ai-runtimes:
    # Rebuild large packs on explicit dispatch. The first validated packs are retained separately.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [modern, powerpaint, anytext]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pip==24.0 setuptools==69.5.1 wheel
      - run: python app/scripts/prepare_ai_sources.py
      - run: python app/scripts/build_ai_runtime.py ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: offline-ai-${{ matrix.profile }}
          path: offline-ai/${{ matrix.profile }}/
          compression-level: 0
          retention-days: 7
